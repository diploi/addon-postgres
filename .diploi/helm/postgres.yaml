apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  selector:
    matchLabels:
      app: postgres
  serviceName: postgres
  replicas: 1
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          {{- $image := .Values.images.postgres }}
          {{- range .Values.env }}
            {{- if and (eq .identifier "POSTGRES_IMAGE") (ne $image .value) }}
              {{ $image = .value}}
            {{- end }}
          {{- end }}         
          image: {{ $image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: PGDATA
              value: /postgres/data
            {{- range .Values.env }}
            - name: {{ .identifier }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
            - name: postgres-mount
              mountPath: /postgres
      volumes:
        - name: postgres-mount
          hostPath:
            path: {{ $.Values.storage.postgres.hostPath }}
